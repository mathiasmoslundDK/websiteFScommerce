  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt-weight: 400;\n  font-display: swap;\n  src: url(\"95fbc0ae-c057-49da-a951-61a050e58a45\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e7be228f-5e45-4a37-8df2-abe6655b0557\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"cc4a1a6f-0cf6-477c-acfc-e1a30fb78fec\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c18bff8f-df8e-4bf6-a7c3-6a61104a8a8c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<script src=\"bb1428db-5eb4-4764-b4b8-829c33a326b1\"><\u002Fscript>\n\n\n\n<style>\n  :root{\n    /* Brand */\n    --teal:#3E6967;          /* Brand teal — headlines, logo ring */\n    --teal-deep:#2A4F4D;     /* Deep teal — button hover, footer, text on lime */\n    --teal-900:#1f3b3a;      /* Darker teal for hero gradient depth */\n    --lime:#C8DC66;          /* Primary CTA, accents, the 'Nice' wordmark */\n    --lime-dark:#b6cc4f;     /* Lime hover */\n    --lime-soft:#e6efb5;     /* Soft lime tint */\n    --ink:#2A2A2A;           /* Body text on white */\n    --slate:#6B7878;         /* Muted captions, secondary text */\n    --line:#e2e6e6;          /* Dividers */\n    --bg:#fafaf7;            /* Paper-warm page surface */\n    --white:#ffffff;\n    /* Aliases (kept so existing rules still work) */\n    --navy-900:var(--teal-900);\n    --navy-700:var(--teal);\n    --blue-600:var(--teal);\n    --blue-accent:var(--lime);\n    --green:var(--lime);\n    --green-dark:var(--lime-dark);\n    --green-glow:rgba(200,220,102,.55);\n    --muted:var(--slate);\n    --warning:#9a5a14;\n    --warning-bg:#fff4e0;\n  }\n\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0}\n  html{-webkit-text-size-adjust:100%}\n  body{\n    font-family:'Geist','Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;\n    font-size:16px;\n    line-height:1.55;\n    color:var(--ink);\n    background:var(--bg);\n    -webkit-font-smoothing:antialiased;\n    text-rendering:optimizeLegibility;\n  }\n  @media(min-width:720px){ body{font-size:17px} }\n\n  img{max-width:100%;display:block}\n  a{color:inherit;text-decoration:none}\n  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}\n\n  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}\n  @media(min-width:720px){ .wrap{padding:0 28px} }\n\n  .serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em}\n  .serif em, .serif i{font-style:italic;color:var(--blue-accent)}\n\n  /* ============ ANNOUNCEMENT BAR ============ */\n  .announce{\n    background:var(--navy-900);\n    color:#cfdcec;\n    font-size:13px;\n    padding:8px 16px;\n    text-align:center;\n    border-bottom:1px solid rgba(255,255,255,.06);\n  }\n  .announce-inner{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}\n  .pulse-dot{\n    width:9px;height:9px;border-radius:50%;background:var(--lime);\n    box-shadow:0 0 0 0 var(--green-glow);\n    animation:pulse 1.8s ease-out infinite;\n    flex:none;\n  }\n  @keyframes pulse{\n    0%{box-shadow:0 0 0 0 rgba(200,220,102,.7)}\n    70%{box-shadow:0 0 0 10px rgba(200,220,102,0)}\n    100%{box-shadow:0 0 0 0 rgba(200,220,102,0)}\n  }\n  .announce strong{color:#fff;font-weight:600}\n  .announce .sep{opacity:.4;margin:0 4px}\n\n  /* ============ NAV ============ */\n  .nav{\n    position:sticky;top:0;z-index:50;\n    background:rgba(255,255,255,.92);\n    backdrop-filter:saturate(180%) blur(10px);\n    -webkit-backdrop-filter:saturate(180%) blur(10px);\n    border-bottom:1px solid var(--line);\n  }\n  .nav-inner{\n    display:flex;align-items:center;justify-content:space-between;\n    height:64px;\n  }\n  .logo{\n    display:flex;align-items:center;gap:10px;\n    font-family:'Instrument Serif',serif;font-size:22px;color:var(--navy-900);\n    line-height:1;\n  }\n  .logo-mark{\n    width:38px;height:38px;flex:none;\n    background-image:url(\"0ab8eddd-e75b-45b2-8f81-7edf61783266\");\n    background-size:contain;background-repeat:no-repeat;background-position:center;\n  }\n  .logo strong{font-family:'Geist',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.01em}\n  .logo small{font-family:'Instrument Serif',serif;font-style:italic;color:var(--muted);font-size:14px;display:block;line-height:1}\n  .logo-text{display:flex;flex-direction:column;gap:3px}\n  @media(max-width:520px){ .logo small{display:none} }\n\n  .nav-call{\n    display:inline-flex;align-items:center;gap:8px;\n    background:var(--lime);color:var(--teal-deep);\n    height:44px;padding:0 16px;border-radius:999px;\n    font-weight:700;font-size:14px;letter-spacing:-.01em;\n    box-shadow:0 1px 0 rgba(0,0,0,.05), 0 4px 14px rgba(62,105,103,.18);\n    transition:transform .15s, box-shadow .15s, background .15s;\n  }\n  .nav-call:hover{transform:translateY(-1px);background:var(--lime-dark);box-shadow:0 1px 0 rgba(0,0,0,.05), 0 6px 20px rgba(62,105,103,.28)}\n  .nav-call svg{width:16px;height:16px}\n  @media(min-width:720px){ .nav-call{height:46px;padding:0 20px;font-size:15px} }\n  @media(max-width:380px){ .nav-call .num{display:none} }\n\n  /* ============ HERO ============ */\n  .hero{\n    background:\n      radial-gradient(1100px 650px at 85% 0%, rgba(200,220,102,.18), transparent 60%),\n      radial-gradient(700px 500px at 10% 100%, rgba(200,220,102,.10), transparent 60%),\n      linear-gradient(180deg, var(--teal-900) 0%, var(--teal) 100%);\n    color:#fff;\n    padding:32px 0 56px;\n    position:relative;\n    overflow:hidden;\n  }\n  /* faint sunburst rays from top-right, echoing the logo */\n  .hero::before{\n    content:\"\";position:absolute;inset:0;pointer-events:none;\n    background:repeating-conic-gradient(from 200deg at 90% -10%, rgba(255,255,255,.05) 0deg 2deg, transparent 2deg 9deg);\n    mask:radial-gradient(700px 700px at 90% -10%, #000 0%, transparent 65%);\n    -webkit-mask:radial-gradient(700px 700px at 90% -10%, #000 0%, transparent 65%);\n  }\n  .hero > .wrap{position:relative;z-index:1}\n  @media(min-width:720px){ .hero{padding:56px 0 88px} }\n  .hero-grid{\n    display:grid;grid-template-columns:1fr;gap:36px;\n  }\n  @media(min-width:960px){\n    .hero-grid{grid-template-columns:1fr 420px;gap:48px;align-items:start}\n  }\n\n  .eyebrow{\n    display:inline-flex;align-items:center;gap:8px;\n    background:rgba(255,255,255,.08);\n    border:1px solid rgba(255,255,255,.16);\n    padding:7px 12px 7px 10px;border-radius:999px;\n    font-size:13px;color:#dfe9fb;letter-spacing:.01em;\n    backdrop-filter:blur(4px);\n  }\n  .eyebrow .pulse-dot{width:7px;height:7px}\n\n  .h1{\n    font-family:'Instrument Serif',serif;font-weight:400;\n    font-size:clamp(40px,7vw,72px);line-height:1.02;letter-spacing:-.02em;\n    margin:18px 0 16px;color:#fff;\n    text-wrap:pretty;\n  }\n  .h1 em{font-style:italic;color:var(--lime)}\n  .hero-sub{\n    color:#c9d6ec;font-size:17px;max-width:540px;margin:0 0 24px;\n    line-height:1.55;\n  }\n  @media(min-width:720px){ .hero-sub{font-size:18px} }\n\n  /* CTA row */\n  .cta-row{display:flex;flex-direction:column;gap:14px;align-items:flex-start}\n  @media(min-width:520px){ .cta-row{flex-direction:row;align-items:center} }\n\n  .btn-call{\n    position:relative;\n    display:inline-flex;align-items:center;gap:12px;\n    background:var(--lime);color:var(--teal-deep);\n    height:64px;padding:0 26px 0 22px;border-radius:14px;\n    font-weight:700;font-size:18px;letter-spacing:-.01em;\n    box-shadow:0 8px 28px rgba(200,220,102,.5), 0 2px 0 rgba(0,0,0,.04), inset 0 1px 0 rgba(255,255,255,.4);\n    transition:transform .15s, background .15s;\n    width:100%;justify-content:center;\n  }\n  @media(min-width:520px){ .btn-call{width:auto} }\n  .btn-call:hover{transform:translateY(-1px);background:var(--lime-dark)}\n  .btn-call:active{transform:translateY(0)}\n  .btn-call svg{width:22px;height:22px}\n  .btn-call .num{font-family:'Geist',sans-serif;font-feature-settings:'tnum' 1}\n\n  /* glowing ring around the hero call button */\n  .btn-call.glow::before,\n  .btn-call.glow::after{\n    content:\"\";position:absolute;inset:-4px;border-radius:18px;\n    border:2px solid var(--lime);\n    animation:ring 2.4s ease-out infinite;\n    pointer-events:none;\n  }\n  .btn-call.glow::after{animation-delay:1.2s}\n  @keyframes ring{\n    0%{transform:scale(.96);opacity:.9}\n    70%{transform:scale(1.18);opacity:0}\n    100%{transform:scale(1.18);opacity:0}\n  }\n\n  .owner-chip{\n    display:inline-flex;align-items:center;gap:10px;\n    background:rgba(255,255,255,.07);\n    border:1px solid rgba(255,255,255,.14);\n    padding:8px 14px 8px 8px;border-radius:999px;\n    color:#e9f0fc;\n  }\n  .owner-chip .ph{\n    width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;\n    background:linear-gradient(135deg,#5a8a87,#2a4f4d);\n  }\n  .owner-chip .ph image-slot{width:38px;height:38px;display:block}\n  .owner-chip .name{font-weight:600;font-size:14px;line-height:1.1}\n  .owner-chip .quote{font-family:'Instrument Serif',serif;font-style:italic;font-size:14px;color:#bcccea;line-height:1.1;margin-top:2px}\n\n  .form-link{\n    display:inline-flex;align-items:center;gap:6px;\n    color:#bcccea;font-size:14px;\n    margin-top:18px;\n    border-bottom:1px dashed rgba(188,204,234,.5);\n    padding-bottom:1px;\n    transition:color .15s,border-color .15s;\n  }\n  .form-link:hover{color:#fff;border-color:#fff}\n\n  .meta-row{\n    display:flex;flex-wrap:wrap;gap:8px 22px;\n    margin-top:26px;color:#bcccea;font-size:14px;\n  }\n  .meta-row span{display:inline-flex;align-items:center;gap:7px}\n  .meta-row svg{width:16px;height:16px;color:var(--lime);flex:none}\n\n  /* trust strip */\n  .trust-strip{\n    margin-top:36px;\n    display:grid;grid-template-columns:repeat(2,1fr);gap:12px;\n    padding-top:24px;border-top:1px solid rgba(255,255,255,.1);\n  }\n  @media(min-width:720px){ .trust-strip{grid-template-columns:repeat(4,1fr);gap:18px} }\n  .trust-item{\n    display:flex;align-items:center;gap:10px;color:#dfe9fb;font-size:13px;line-height:1.25;\n  }\n  .trust-item .ic{\n    width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.08);\n    display:grid;place-items:center;color:#fff;flex:none;\n    border:1px solid rgba(255,255,255,.12);\n  }\n  .trust-item strong{color:#fff;font-weight:600;display:block}\n  .trust-item small{color:#9fb1cf;font-size:12px}\n  .trust-item svg{width:16px;height:16px}\n  .star-row{color:#ffc15c;letter-spacing:1px;font-size:12px}\n\n  /* ============ FORM CARD ============ */\n  .form-card{\n    background:#fff;color:var(--ink);\n    border-radius:18px;padding:22px;\n    box-shadow:0 30px 60px -20px rgba(7,18,40,.45), 0 8px 20px -8px rgba(7,18,40,.3);\n    border:1px solid rgba(255,255,255,.12);\n  }\n  @media(min-width:720px){ .form-card{padding:26px} }\n  .form-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}\n  .form-title{font-family:'Instrument Serif',serif;font-size:26px;line-height:1.1;color:var(--navy-900)}\n  .form-title em{font-style:italic;color:var(--teal)}\n  .form-sub{color:var(--muted);font-size:14px;margin:6px 0 16px}\n\n  .seg{\n    display:grid;grid-template-columns:repeat(2,1fr);gap:6px;\n    background:#eef2f8;padding:5px;border-radius:12px;margin-bottom:14px;\n  }\n  @media(min-width:520px){ .seg{grid-template-columns:repeat(4,1fr)} }\n  .seg button{\n    height:40px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);\n    transition:background .15s,color .15s,box-shadow .15s;\n  }\n  .seg button.on{background:#fff;color:var(--teal-deep);box-shadow:0 1px 2px rgba(0,0,0,.06), 0 1px 0 rgba(0,0,0,.02)}\n\n  .field{margin-bottom:12px}\n  .field label{display:block;font-size:13px;font-weight:600;color:var(--navy-900);margin-bottom:6px}\n  .field input{\n    width:100%;height:50px;padding:0 14px;border-radius:10px;\n    border:1px solid var(--line);background:#fff;\n    font-family:inherit;font-size:16px;color:var(--ink);\n    transition:border-color .15s,box-shadow .15s;\n  }\n  .field input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 4px rgba(62,105,103,.15)}\n  .field.err input{border-color:#d4321a;box-shadow:0 0 0 4px rgba(212,50,26,.12)}\n  .field .err-msg{display:none;color:#d4321a;font-size:12px;margin-top:4px}\n  .field.err .err-msg{display:block}\n\n  .scarcity{\n    display:flex;align-items:center;gap:8px;\n    background:var(--warning-bg);color:var(--warning);\n    border:1px solid #ffe2bd;\n    padding:9px 12px;border-radius:10px;font-size:13px;font-weight:500;\n    margin:4px 0 14px;\n  }\n  .scarcity svg{width:16px;height:16px;flex:none}\n\n  .submit{\n    width:100%;height:54px;border-radius:12px;\n    background:var(--teal-deep);color:#fff;\n    font-weight:700;font-size:16px;letter-spacing:-.005em;\n    transition:background .15s,transform .15s;\n    display:inline-flex;align-items:center;justify-content:center;gap:8px;\n  }\n  .submit:hove >\n      <article class=\"review\">\n        <div class=\"stars\">★★★★★<\u002Fdiv>\n        <p>Got three quotes, Steven's wasn't the cheapest but he was the only one who actually rang back. Fixed price, no surprises, and a really tidy spray finish on the new build.<\u002Fp>\n        <div class=\"by\">\n          <span class=\"av\">JT<\u002Fspan>\n          <div class=\"meta\"><strong>James T.<\u002Fstrong><small>Epsom · new build, Level 5<\u002Fsmall><\u002Fdiv>\n          <span class=\"src\">GOOGLE<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"review\">\n        <div class=\"stars\">★★★★★<\u002Fdiv>\n        <p>Genuinely nice guys. Painted our villa exterior in a horrible week of weather and just got on with it. Cleaned up every day. The kids loved them. Will use again.<\u002Fp>\n        <div class=\"by\">\n          <span class=\"av\">AR<\u002Fspan>\n          <div class=\"meta\"><strong>Aroha &amp; Dan R.<\u002Fstrong><small>Mt Eden · weatherboard exterior<\u002Fsmall><\u002Fdiv>\n          <span class=\"src\">FACEBOOK<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ GUARANTEE ============ -->\n<div class=\"guarantee\">\n  <div class=\"wrap\">\n    <div class=\"gtee-card\">\n      <div class=\"shield\" aria-hidden=\"true\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div>\n        <h3>Not happy? <em>We'll come back free.<\u002Fem><\u002Fh3>\n        <p>Sounds simple because it is. If anything's not up to scratch within 12 months, we come back and fix it — no charge, no fuss.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"chips\">\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg> Fully insured<\u002Fspan>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg> Level 4 &amp; 5 spray finish<\u002Fspan>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg> On time, every time<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ FAQ ============ -->\n<section aria-labelledby=\"faq-h\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow-dark\" style=\"text-align:center;display:block\">Common questions<\u002Fspan>\n    <h2 class=\"h2 serif\" id=\"faq-h\" style=\"text-align:center\">Things people <em>actually<\u002Fem> ask.<\u002Fh2>\n    <p class=\"lead\" style=\"text-align:center;margin:0 auto 36px\">Can't find your question? Give Steven a ring — he'll know.<\u002Fp>\n\n    <div class=\"faq-list\">\n      <details class=\"faq\">\n        <summary>How do you price a job? <span class=\"plus\" aria-hidden=\"true\">+<\u002Fspan><\u002Fsummary>\n        <div class=\"faq-body\">\n          We come and look at the job in person — no pressure, no obligation. You'll get a <strong>fixed-price written quote<\u002Fstrong> back within 24 hours, GST included, with paint &amp; prep itemised. The price you sign is the price you pay.\n        <\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq\">\n        <summary>What paint brands do you use? <span class=\"plus\" aria-hidden=\"true\">+<\u002Fspan><\u002Fsummary>\n        <div class=\"faq-body\">\n          We're a <strong>Resene Eco-Decorator<\u002Fstrong> by default, and we also use <strong>Dulux<\u002Fstrong> and Wattyl when the spec calls for it. Happy to match whatever your designer or architect has specified.\n        <\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq\">\n        <summary>Are you insured? <span class=\"plus\" aria-hidden=\"true\">+<\u002Fspan><\u002Fsummary>\n        <div class=\"faq-body\">\n          Yes — <strong>$2M public liability<\u002Fstrong> cover, full Health &amp; Safety system, Sitewise green for commercial work, and every painter on the team is qualified and inducted. NZBN registered.\n        <\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq\">\n        <summary>How soon can you start? <span class=\"plus\" aria-hidden=\"true\">+<\u002Fspan><\u002Fsummary>\n        <div class=\"faq-body\">\n          Currently booking <strong>2–3 weeks out<\u002Fstrong> for residential, sooner for small jobs and emergencies. We hold a few slots each week for last-minute work — give us a ring.\n        <\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq\">\n        <summary>Do you do prep work? <span class=\"plus\" aria-hidden=\"true\">+<\u002Fspan><\u002Fsummary>\n        <div class=\"faq-body\">\n          Of course — and properly. <strong>Filling, sanding, masking, priming and any minor gib repairs are all included<\u002Fstrong> in the quote. A nice paint job is 80% prep and we don't shortcut it.\n        <\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq\">\n        <summary>What areas do you cover? <span class=\"plus\" aria-hidden=\"true\">+<\u002Fspan><\u002Fsummary>\n        <div class=\"faq-body\">\n          Auckland-wide, from Whangaparāoa to Pukekohe. We've also got a <strong>travelling team for Nelson and Wellington<\u002Fstrong> — call us if you're outside Auckland and we'll work it out.\n        <\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq\">\n        <summary>Do you do small jobs too? <span class=\"plus\" aria-hidden=\"true\">+<\u002Fspan><\u002Fsummary>\n        <div class=\"faq-body\">\n          Absolutely. <strong>Patch repairs, single rooms, fence touch-ups<\u002Fstrong> — through to full exterior repaints and large commercial fitouts. No job too small if we can fit it in.\n        <\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq\">\n        <summary>What's your guarantee? <span class=\"plus\" aria-hidden=\"true\">+<\u002Fspan><\u002Fsummary>\n        <div class=\"faq-body\">\n          <strong>12-month workmanship guarantee.<\u002Fstrong> If anything fails, peels or doesn't meet the standard, we come back and fix it — free. That's the whole \"Be Nice, Do Nice Paint Work\" thing.\n        <\u002Fdiv>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FINAL CTA ============ -->\n<section class=\"final\" aria-labelledby=\"final-h\">\n  <div class=\"wrap final-grid\">\n    <div class=\"owner-photo\">\n      <image-slot id=\"owner-final-photo\" placeholder=\"Steven on the job — full photo\" shape=\"rect\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <div>\n      <span class=\"eyebrow\" style=\"margin-bottom:14px\">\n        <span class=\"pulse-dot\" aria-hidden=\"true\"><\u002Fspan>\n        Steven, Director · founded 2011\n      <\u002Fspan>\n      <h2 class=\"h2 serif\" id=\"final-h\" style=\"color:#fff;margin:0 0 18px\">\n        Give me a <em>call<\u002Fem> and I'll come round for a free quote.\n      <\u002Fh2>\n      <p class=\"quote-handwritten\">\"I'll answer the phone myself — and if I can't, I'll ring you back the same day. <span>Promise.<\u002Fspan>\"<\u002Fp>\n      <p class=\"signature\">— Steven<\u002Fp>\n\n      <a href=\"tel:+64272300146\" class=\"btn-call glow\" data-track=\"final-call\" style=\"margin-top:8px\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.86 19 tor('.seg');\n  var hidden = document.querySelector('input[name=\"service\"]');\n  if (seg) {\n    seg.addEventListener('click', function(e){\n      var btn = e.target.closest('button[data-svc]');\n      if (!btn) return;\n      seg.querySelectorAll('button').forEach(function(b){ b.classList.remove('on'); });\n      btn.classList.add('on');\n      hidden.value = btn.dataset.svc;\n    });\n  }\n\n  // form validation + toast\n  var form = document.querySelector('form.form-card');\n  var toast = document.getElementById('toast');\n  function showToast(name){\n    document.getElementById('toast-title').textContent = 'Thanks ' + (name || 'mate') + '!';\n    document.getElementById('toast-msg').textContent = \"We'll call you within 1 hour.\";\n    toast.classList.add('show');\n    setTimeout(function(){ toast.classList.remove('show'); }, 5200);\n  }\n  if (form) {\n    var nameField = document.getElementById('f-name');\n    var phoneField = document.getElementById('f-phone');\n    var nameInput = document.getElementById('i-name');\n    var phoneInput = document.getElementById('i-phone');\n\n    function validate(){\n      var ok = true;\n      if (!nameInput.value.trim()) { nameField.classList.add('err'); ok = false; }\n      else { nameField.classList.remove('err'); }\n      var digits = (phoneInput.value || '').replace(/\\D/g,'');\n      if (digits.length < 8) { phoneField.classList.add('err'); ok = false; }\n      else { phoneField.classList.remove('err'); }\n      return ok;\n    }\n    nameInput.addEventListener('input', function(){ if (nameInput.value.trim()) nameField.classList.remove('err'); });\n    phoneInput.addEventListener('input', function(){\n      var d = phoneInput.value.replace(/\\D/g,'');\n      if (d.length >= 8) phoneField.classList.remove('err');\n    });\n\n    form.addEventListener('submit', function(e){\n      e.preventDefault();\n      if (!validate()) return;\n      var first = nameInput.value.trim().split(/\\s+/)[0];\n      // simulate submit\n      form.querySelector('.submit').textContent = 'Sent ✓';\n      showToast(first);\n      setTimeout(function(){\n        form.reset();\n        seg.querySelectorAll('button').forEach(function(b){ b.classList.remove('on'); });\n        seg.querySelector('button[data-svc=\"Interior\"]').classList.add('on');\n        hidden.value = 'Interior';\n        var btn = form.querySelector('.submit');\n        btn.innerHTML = \"Send &amp; we'll call you back\" +\n          ' <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/><polyline points=\"12 5 19 12 12 19\"/><\u002Fsvg>';\n      }, 3000);\n    });\n  }\n\n  // analytics shim — log clicks on tracked CTAs\n  document.addEventListener('click', function(e){\n    var t = e.target.closest('[data-track]');\n    if (!t) return;\n    // console.log('[track]', t.dataset.track);\n  });\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
